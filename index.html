<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Licznik PWS</title>
    <style>
        /* Te style blokują marginesy i dopasowują stronę do ekranu smartfona */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        /* Ramka zajmuje 100% ekranu i wymusza poprawne suwaki z Google */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- TUTAJ: zamiast /edit wpisałem /preview, co usunie pasek tytułowy z telefonu -->
    <iframe src="https://docs.google.com/spreadsheets/d/1OmkKHiEm0jA9nhygs3UV8yOkhDYt3EntSV4YZf-zf8U/preview?gid=2052610161#gid=2052610161"></iframe>

</body>
</html>
